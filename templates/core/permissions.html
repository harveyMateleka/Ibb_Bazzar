{% extends "core/base.html" %}

{% block app_content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Sécurité</p>
    <h1>Permissions</h1>
  </div>
</div>

<section class="panel">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Application</th>
          <th>Code</th>
          <th>Libellé</th>
        </tr>
      </thead>
      <tbody>
        {% for p in permissions %}
        <tr>
          <td>{{ p.content_type.app_label }}</td>
          <td><code>{{ p.codename }}</code></td>
          <td>{{ p.name }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Aucune permission.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
