{% extends "approvisionnement/base.html" %}

{% block app_title %}Entrée stock{% endblock %}

{% block app_content %}
<div class="page-head">
  <div>
    <p class="eyebrow">APP-02</p>
    <h1>Entrée stock</h1>
  </div>
</div>

<section class="panel form-panel">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-grid">
      {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
      {% endfor %}
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Valider l’entrée</button>
    </div>
  </form>
</section>
{% endblock %}
