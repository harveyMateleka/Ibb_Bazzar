{% extends "base.html" %}

{% block title %}Connexion · IBBS BAZAR{% endblock %}

{% block content %}
<section class="section">
  <div class="section-inner">
    <div class="page-head">
      <div>
        <p class="eyebrow">Accès</p>
        <h1>Connexion</h1>
      </div>
    </div>
    <section class="panel form-panel">
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="form-grid">
          {% for field in form %}
          <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
          {% endfor %}
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </div>
      </form>
    </section>
  </div>
</section>
{% endblock %}
