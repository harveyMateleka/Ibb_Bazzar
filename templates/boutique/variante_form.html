{% extends "boutique/base.html" %}

{% block app_content %}
<div class="page-head">
  <div>
    <p class="eyebrow">Articles</p>
    <h1>Nouvelle variante</h1>
  </div>
</div>

<section class="panel form-panel">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
      {{ field.errors }}
    </div>
    {% endfor %}
    <div class="actions">
      <button type="submit" class="btn btn-primary">Enregistrer la variante</button>
      <a class="btn btn-ghost" href="{% url 'boutique:articles' %}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
